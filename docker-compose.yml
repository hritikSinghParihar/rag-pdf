services:
  app:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload
    ports:
      - "8002:8002"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - TRANSFORMERS_OFFLINE=1
      - HF_HUB_OFFLINE=1
    networks:
      - rag-network

  worker:
    build: .
    command: celery -A app.workers.celery_app worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - TRANSFORMERS_OFFLINE=1
      - HF_HUB_OFFLINE=1
    networks:
      - rag-network

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    command: streamlit run ui.py --server.port 8501 --server.address 0.0.0.0
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://app:8002/api/v1
    depends_on:
      - app
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1280
